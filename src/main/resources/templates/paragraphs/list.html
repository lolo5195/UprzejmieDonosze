<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista paragrafów</title>
</head>
<body>

<h1>Lista paragrafów</h1>

<a th:href="@{/paragraphs/new}">Dodaj nowy paragraf</a>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nazwa</th>
        <th>Opis</th>
        <th>Waga</th>
        <th>Aktywny</th>
        <th>Akcje</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="paragraph : ${paragraphs}">
        <td th:text="${paragraph.id}"></td>
        <td th:text="${paragraph.title}"></td>
        <td th:text="${paragraph.description}"></td>
        <td th:text="${paragraph.severity}"></td>
        <td th:text="${paragraph.active ? 'Tak' : 'Nie'}"></td>
        <td>
            <a th:href="@{/paragraphs/{id}/edit(id=${paragraph.id})}">Edytuj</a>
            |
            <a th:href="@{/paragraphs/{id}/delete(id=${paragraph.id})}"
               onclick="return confirm('Na pewno usunąć?')">Usuń</a>
        </td>
    </tr>
    </tbody>
</table>

<br>
<a th:href="@{/users}">Przejdź do użytkowników</a>
|
<a th:href="@{/reports}">Przejdź do donosów</a>

</body>
</html>
