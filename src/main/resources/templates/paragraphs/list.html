<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Lista paragrafów', 'rejestr paragrafów', ~{::section})}">
<body>
<section class="card">
    <p><a class="btn" th:href="@{/paragraphs/new}">Dodaj nowy paragraf</a></p>

    <div class="table-wrap">
        <table class="table">
            <caption>Katalog paragrafów przewinień</caption>
            <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Nazwa</th>
                <th scope="col">Opis</th>
                <th scope="col">Waga</th>
                <th scope="col">Aktywny</th>
                <th scope="col">Akcje</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="paragraph : ${paragraphs}">
                <td th:text="${paragraph.id}"></td>
                <td th:text="${paragraph.title}"></td>
                <td th:text="${paragraph.description}"></td>
                <td th:text="${paragraph.severity}"></td>
                <td>
                    <span class="badge-status"
                          th:classappend="${paragraph.active ? 'active' : 'inactive'}"
                          th:text="${paragraph.active ? 'Aktywny' : 'Nieaktywny'}"></span>
                </td>
                <td>
                    <ul class="action-list">
                        <li><a th:href="@{/paragraphs/{id}/edit(id=${paragraph.id})}">Edytuj</a></li>
                        <li>
                            <a class="btn btn-danger"
                               th:href="@{/paragraphs/{id}/delete(id=${paragraph.id})}"
                               onclick="return confirm('Na pewno usunąć paragraf?')">Usuń</a>
                        </li>
                    </ul>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
