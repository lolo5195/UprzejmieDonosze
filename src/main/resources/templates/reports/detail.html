<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Szczegóły donosu</title>
</head>
<body>

<h1>Szczegóły donosu</h1>

<nav>
  <a th:href="@{/}">Start</a>|
    <a th:href="@{/reports}">Powrót do listy donosów</a>|
</nav>

<hr>

<p>
  <strong>ID:</strong>
  <span th:text="${report.id}"></span>
</p>

<p>
  <strong>Tytuł:</strong>
    <span th:text="${report.title}"></span>
</p>

<p>
  <strong>Opis:</strong>
    <span th:text="${report.description}"></span>
</p>

<p>
    <strong>Oskarżony student:</strong>
        <span th:text="${report.accusedStudentName}"></span>
</p>

<p>
    <strong>Paragraf:</strong>
        <span th:text="${report.paragraph != null ? report.paragraph.title : 'Brak'}"></span>
</p>

<p>
    <strong>Autor:</strong>
        <span th:text="${report.author != null ? report.author.username : 'Brak'}"></span>
</p>

<p>
    <strong>Data zdarzenia:</strong>
        <span th:text="${report.eventDate}"></span>
</p>

<p>
    <strong>Status:</strong>
        <span th:text="${report.status}"></span>
</p>

<p>
    <strong>Utworzono:</strong>
        <span th:text="${report.createdAt}"></span>
</p>

<hr>

<a th:href="@{/reports/{id}/edit(id=${report.id})}">Edytuj donos</a>

</body>
</html>
