<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Szczegóły donosu', 'akta sprawy', ~{::section})}">
<body>
<section class="card">
    <dl class="details-list">
        <div>
            <dt>ID</dt>
            <dd th:text="${report.id}"></dd>
        </div>
        <div>
            <dt>Tytuł</dt>
            <dd th:text="${report.title}"></dd>
        </div>
        <div>
            <dt>Opis</dt>
            <dd th:text="${report.description}"></dd>
        </div>
        <div>
            <dt>Oskarżony student</dt>
            <dd th:text="${report.accusedUser != null ? report.accusedUser.username + ((report.accusedUser.firstName != null or report.accusedUser.lastName != null) ? ' - ' + (report.accusedUser.firstName != null ? report.accusedUser.firstName : '') + ' ' + (report.accusedUser.lastName != null ? report.accusedUser.lastName : '') : '') : 'Brak'}"></dd>
        </div>
        <div>
            <dt>Paragraf</dt>
            <dd th:text="${report.paragraph != null ? report.paragraph.title : 'Brak'}"></dd>
        </div>
        <div>
            <dt>Autor</dt>
            <dd th:text="${report.author != null ? report.author.username : 'Brak'}"></dd>
        </div>
        <div>
            <dt>Data zdarzenia</dt>
            <dd th:text="${report.eventDate}"></dd>
        </div>
        <div>
            <dt>Status</dt>
            <dd>
                <span class="badge-status"
                      th:classappend="${report.status != null ? report.status.name().toLowerCase() : ''}"
                      th:text="${report.status}"></span>
            </dd>
        </div>
        <div>
            <dt>Utworzono</dt>
            <dd th:text="${report.createdAt}"></dd>
        </div>
    </dl>

    <ul class="action-list">
        <li>
            <a class="btn"
               th:if="${#authorization.expression('hasRole(''ADMIN'')') or report.author.username == #authentication.name}"
               th:href="@{/reports/{id}/edit(id=${report.id})}">
                Edytuj donos
            </a>
        </li>

        <li>
            <a class="btn btn-secondary"
               th:href="@{/share/{token}(token=${report.shareToken})}"
               target="_blank">
                Otwórz publiczny link
            </a>
        </li>

        <li>
            <a class="btn btn-secondary" th:href="@{/reports}">
                Powrót do listy donosów
            </a>
        </li>
    </ul>
</section>
</body>
</html>
