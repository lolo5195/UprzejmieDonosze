<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formularz donosu</title>
</head>
<body>

<h1 th:text="${reportForm.id == null ? 'Dodaj donos' : 'Edytuj donos'}"></h1>

<form th:action="@{/reports/save}" th:object="${reportForm}" method="post">

    <input type="hidden" th:field="*{id}">

    <div>
        <label for="title">Tytuł:</label>
        <input id="title" type="text" th:field="*{title}">
        <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
    </div>

    <div>
        <label for="description">Opis:</label>
        <textarea id="description" th:field="*{description}"></textarea>
        <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
    </div>

    <div>
        <label for="accusedStudentName">Zgłaszany student:</label>
        <input id="accusedStudentName" type="text" th:field="*{accusedStudentName}">
        <div th:if="${#fields.hasErrors('accusedStudentName')}" th:errors="*{accusedStudentName}"></div>
    </div>

    <div>
        <label for="eventDate">Data przewinienia:</label>
        <input id="eventDate" type="date" th:field="*{eventDate}">
        <div th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}"></div>
    </div>

    <div>
        <label for="paragraphId">Paragraf:</label>
        <select id="paragraphId" th:field="*{paragraphId}">
            <option value="">-- wybierz paragraf --</option>
            <option th:each="paragraph : ${paragraphs}"
                    th:value="${paragraph.id}"
                    th:text="${paragraph.title}">
            </option>
        </select>
        <div th:if="${#fields.hasErrors('paragraphId')}" th:errors="*{paragraphId}"></div>
    </div>

    <div>
        <label for="authorId">Autor:</label>
        <select id="authorId" th:field="*{authorId}">
            <option value="">-- wybierz autora --</option>
            <option th:each="author : ${authors}"
                    th:value="${author.id}"
                    th:text="${author.username}">
            </option>
        </select>
        <div th:if="${#fields.hasErrors('authorId')}" th:errors="*{authorId}"></div>
    </div>

    <div>
        <label for="status">Status:</label>
        <select id="status" th:field="*{status}">
            <option th:each="status : ${statuses}"
                    th:value="${status}"
                    th:text="${status}">
            </option>
        </select>
        <div th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
    </div>

    <button type="submit">Zapisz</button>
</form>

<br>
<a th:href="@{/reports}">Powrót do listy donosów</a>

</body>
</html>
