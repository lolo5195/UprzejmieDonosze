<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(${reportForm.id == null ? 'Dodaj donos' : 'Edytuj donos'}, 'akta donosu', ~{::section})}">
<body>
<section class="card" th:object="${reportForm}">
    <div class="alert alert-error" role="alert" th:if="${#fields.hasAnyErrors()}">
        Formularz zawiera błędy. Popraw pola oznaczone komunikatem.
    </div>

    <form th:action="@{/reports/save}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="form-field">
            <label for="title">Tytuł</label>
            <input id="title" type="text" th:field="*{title}">
            <div class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>

        <div class="form-field">
            <label for="description">Opis</label>
            <textarea id="description" th:field="*{description}"></textarea>
            <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <div class="form-field">
            <label for="accusedStudentName">Zgłaszany student</label>
            <input id="accusedStudentName" type="text" th:field="*{accusedStudentName}">
            <div class="field-error" th:if="${#fields.hasErrors('accusedStudentName')}" th:errors="*{accusedStudentName}"></div>
        </div>

        <div class="form-field">
            <label for="eventDate">Data przewinienia</label>
            <input id="eventDate" type="date" th:field="*{eventDate}">
            <div class="field-error" th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}"></div>
        </div>

        <div class="form-field">
            <label for="paragraphId">Paragraf</label>
            <select id="paragraphId" th:field="*{paragraphId}">
                <option value="">-- wybierz paragraf --</option>
                <option th:each="paragraph : ${paragraphs}"
                        th:value="${paragraph.id}"
                        th:text="${paragraph.title}">
                </option>
            </select>
            <div class="field-error" th:if="${#fields.hasErrors('paragraphId')}" th:errors="*{paragraphId}"></div>
        </div>



        <div class="form-field">
            <label for="status">Status</label>
            <select id="status" th:field="*{status}">
                <option th:each="status : ${statuses}"
                        th:value="${status}"
                        th:text="${status}">
                </option>
            </select>
            <div class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
        </div>

        <ul class="action-list">
            <li><button type="submit">Zapisz</button></li>
            <li><a class="btn btn-secondary" th:href="@{/reports}">Powrót do listy donosów</a></li>
        </ul>
    </form>
</section>
</body>
</html>
