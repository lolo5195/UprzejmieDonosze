<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Logowanie - Uprzejmie Donoszę</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<a class="skip-link" href="#main">Przejdź do treści</a>
<header>
    <p class="stamp">akta dostępu</p>
    <h1>Logowanie</h1>
    <nav aria-label="Nawigacja główna">
        <ul>
            <li><a th:href="@{/}">Strona główna</a></li>
            <li><a th:href="@{/register}">Rejestracja</a></li>
        </ul>
    </nav>
</header>

<main id="main">
    <section class="card">
        <div class="alert alert-error" role="alert" th:if="${param.error}">
            Nieprawidłowy login lub hasło.
        </div>
        <div class="alert" role="status" th:if="${param.logout}">
            Wylogowano pomyślnie.
        </div>
        <div class="alert" role="status" th:if="${param.registered}">
            Konto zostało utworzone. Możesz się zalogować.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-field">
                <label for="username">Login</label>
                <input id="username" name="username" type="text" autocomplete="username" required>
            </div>

            <div class="form-field">
                <label for="password">Hasło</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>

            <button type="submit">Zaloguj</button>
        </form>
    </section>
</main>

<footer>
    <p>Uprzejmie Donoszę</p>
</footer>
</body>
</html>
