<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Logowanie', 'akta dostępu', ~{::section})}">
<body>
<section class="card">
    <div class="alert alert-error" role="alert" th:if="${param.error}">
        Nieprawidłowy login lub hasło.
    </div>
    <div class="alert" role="status" th:if="${param.logout}">
        Wylogowano pomyślnie.
    </div>
    <div class="alert" role="status" th:if="${param.registered}">
        Konto zostało utworzone. Możesz się zalogować.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-field">
            <label for="username">Login</label>
            <input id="username" name="username" type="text" autocomplete="username" required>
        </div>

        <div class="form-field">
            <label for="password">Hasło</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <button type="submit">Zaloguj</button>
    </form>
</section>
</body>
</html>
