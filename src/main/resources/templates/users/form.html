<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(${userForm.id == null ? 'Dodaj użytkownika' : 'Edytuj użytkownika'}, 'akta użytkownika', ~{::section})}">
<body>
<section class="card" th:object="${userForm}">
    <div class="alert alert-error" role="alert" th:if="${#fields.hasAnyErrors()}">
        Formularz zawiera błędy. Popraw pola oznaczone komunikatem.
    </div>

    <form th:action="@{/users/save}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="form-field">
            <label for="username">Login</label>
            <input id="username" type="text" th:field="*{username}" autocomplete="username">
            <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>

        <div class="form-field">
            <label for="password">Hasło</label>
            <input id="password" type="password" th:field="*{password}" autocomplete="new-password">
            <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <div class="form-field">
            <label for="firstName">Imię</label>
            <input id="firstName" type="text" th:field="*{firstName}" autocomplete="given-name">
            <div class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
        </div>

        <div class="form-field">
            <label for="lastName">Nazwisko</label>
            <input id="lastName" type="text" th:field="*{lastName}" autocomplete="family-name">
            <div class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
        </div>

        <div class="form-field">
            <label for="role">Rola</label>
            <select id="role" th:field="*{role}">
                <option th:each="role : ${roles}"
                        th:value="${role}"
                        th:text="${role}">
                </option>
            </select>
            <div class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
        </div>

        <ul class="action-list">
            <li><button type="submit">Zapisz</button></li>
            <li><a class="btn btn-secondary" th:href="@{/users}">Powrót do listy użytkowników</a></li>
        </ul>
    </form>
</section>
</body>
</html>
